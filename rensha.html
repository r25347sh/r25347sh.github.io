<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine用 連写カメラ</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- JSZip for bundling images inside browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-md p-6 mt-4">
        <h1 class="text-xl font-bold text-center mb-6 text-indigo-600">📸 TM連写カメラ</h1>

        <!-- Camera Preview -->
        <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden mb-6 shadow-inner">
            <video id="video" class="w-full h-full object-cover" autoplay playsinline muted></video>
            <div id="counter" class="absolute top-2 right-2 bg-indigo-600 text-white text-xs px-2 py-1 rounded font-bold hidden">
                撮影数: <span id="photo-count">0</span>枚
            </div>
        </div>

        <!-- Controls -->
        <div class="space-y-4">
            <!-- ZIP File Name -->
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">ZIPファイル名</label>
                <input id="filename-input" type="text" value="tm-dataset" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>

            <!-- Interval Slider -->
            <div>
                <div class="flex justify-between text-xs font-bold text-slate-500 uppercase mb-1">
                    <span>連射間隔</span>
                    <span id="interval-val" class="text-indigo-600 font-mono">100ms</span>
                </div>
                <input id="interval-slider" type="range" min="50" max="1000" step="50" value="100" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
            </div>

            <!-- Camera Switch -->
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">カメラ切り替え</label>
                <select id="camera-select" class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    <option value="user">インカメ (前面)</option>
                    <option value="environment" selected>アウカメ (背面)</option>
                </select>
            </div>

            <!-- Action Button -->
            <button id="action-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-sm text-center cursor-pointer">
                連射開始
            </button>
        </div>
    </div>

    <!-- Hidden canvas for capturing frames -->
    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const filenameInput = document.getElementById('filename-input');
        const intervalSlider = document.getElementById('interval-slider');
        const intervalVal = document.getElementById('interval-val');
        const cameraSelect = document.getElementById('camera-select');
        const actionBtn = document.getElementById('action-btn');
        const counter = document.getElementById('counter');
        const photoCountSpan = document.getElementById('photo-count');

        let currentStream = null;
        let shootInterval = null;
        let isShooting = false;
        let imagesCaptured = [];
        let photoIndex = 0;

        // Update interval UI label
        intervalSlider.addEventListener('input', (e) => {
            intervalVal.textContent = `${e.target.value}ms`;
        });

        // Initialize and switch camera
        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const facingMode = cameraSelect.value;
            const constraints = {
                video: {
                    facingMode: facingMode,
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                alert('カメラの起動に失敗しました: ' + err.message);
            }
        }

        cameraSelect.addEventListener('change', startCamera);

        // Capture a single frame to array
        function captureFrame() {
            if (video.videoWidth === 0 || video.videoHeight === 0) return;

            // Maintain aspect ratio or direct match
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convert to base64 DataURL (JPEG for performance/smaller size)
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            imagesCaptured.push(dataUrl);

            photoIndex++;
            photoCountSpan.textContent = photoIndex;
        }

        // Start shooting sequence
        function startShooting() {
            isShooting = true;
            imagesCaptured = [];
            photoIndex = 0;
            photoCountSpan.textContent = '0';
            counter.classList.remove('hidden');

            actionBtn.textContent = '停止してZIPダウンロード';
            actionBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
            actionBtn.classList.add('bg-rose-600', 'hover:bg-rose-700');

            const ms = parseInt(intervalSlider.value, 10);
            shootInterval = setInterval(captureFrame, ms);
        }

        // Stop shooting and trigger ZIP download
        async function stopShooting() {
            isShooting = false;
            clearInterval(shootInterval);

            actionBtn.textContent = 'ZIP生成中...';
            actionBtn.disabled = true;

            if (imagesCaptured.length > 0) {
                const zip = new JSZip();
                
                // Add all captured images to zip
                imagesCaptured.forEach((dataUrl, idx) => {
                    const base64Data = dataUrl.split(',')[1];
                    // Pad index with zeros for clean alphabetical sorting in TM
                    const paddedIdx = String(idx + 1).padStart(4, '0');
                    zip.file(`image_${paddedIdx}.jpg`, base64Data, { base64: true });
                });

                // Generate and download zip
                try {
                    const content = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(content);
                    const a = document.createElement('a');
                    
                    const zipName = (filenameInput.value.trim() || 'tm-dataset') + '.zip';
                    a.href = url;
                    a.download = zipName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (err) {
                    alert('ZIPファイルの作成に失敗しました: ' + err.message);
                }
            } else {
                alert('写真が1枚も撮影されませんでした。');
            }

            // Reset UI
            actionBtn.textContent = '連射開始';
            actionBtn.disabled = false;
            actionBtn.classList.remove('bg-rose-600', 'hover:bg-rose-700');
            actionBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
            counter.classList.add('hidden');
        }

        // Toggle action button click
        actionBtn.addEventListener('click', () => {
            if (!isShooting) {
                startShooting();
            } else {
                stopShooting();
            }
        });

        // Start camera on initial load
        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
