<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI学習用 スポット連続撮影ツール Pro</title>
  <!-- ZIP圧縮用の外部ライブラリ (JSZip) -->
  <script src="https://cloudflare.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 15px;
    }
    h2 { margin-bottom: 5px; font-size: 1.2rem; }
    
    .config-panel {
      background: #222;
      padding: 12px;
      border-radius: 8px;
      width: 85%;
      max-width: 320px;
      margin: 0 auto 15px auto;
      text-align: left;
      font-size: 0.9rem;
    }
    .config-group {
      margin-bottom: 10px;
    }
    .config-group:last-child { margin-bottom: 0; }
    label { display: block; color: #ccc; margin-bottom: 3px; font-weight: bold; }
    
    input[type="text"] {
      padding: 8px;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
      width: 93%;
      background: #333;
      color: #fff;
    }
    
    /* セレクトボックスのスタイル（幅広い選択に対応） */
    select {
      width: 100%;
      padding: 8px;
      font-size: 1rem;
      border-radius: 5px;
      background: #333;
      color: #fff;
      border: none;
    }
    
    /* カメラ切り替えボタン */
    .btn-switch {
      background: #555; color: white; border: none; padding: 6px 12px;
      font-size: 0.85rem; border-radius: 4px; cursor: pointer; float: right;
    }

    #video-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #controls {
      margin-top: 15px;
    }
    button.main-btn {
      font-size: 1.1rem;
      font-weight: bold;
      padding: 15px 30px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      width: 85%;
      max-width: 340px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    .btn-start { background: #ff3b30; color: white; }
    .btn-start:active { background: #cc2e24; }
    .btn-stop { background: #34c759; color: white; }
    #status {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #aaa;
      padding: 0 10px;
    }
    canvas { display: none; }
    .clearfix::after { content: ""; clear: both; display: table; }
  </style>
</head>
<body>

  <h2>📸 スポット撮影ツール Pro</h2>
  
  <!-- 設定パネル -->
  <div class="config-panel">
    <div class="config-group">
      <label for="spot-name">📂 スポット名 (ZIP名)</label>
      <input type="text" id="spot-name" value="spot_01" placeholder="例: keyaki_entrance">
    </div>
    
    <div class="config-group">
      <div class="clearfix">
        <label style="float: left;" for="fps-select">⏱️ 連写速度（間隔）</label>
        <!-- カメラ切り替えボタン -->
        <button class="btn-switch" onclick="switchCamera()">🔄 カメラ切替</button>
      </div>
      <select id="fps-select" onchange="updateFPS(this.value)">
        <option value="0.5">2秒に1枚 (じっくり・高画質向け)</option>
        <option value="1">1秒に1枚 (1 fps)</option>
        <option value="2">1秒に2枚 (2 fps)</option>
        <option value="5">1秒に5枚 (5 fps)</option>
        <option value="10">1秒に10枚 (10 fps)</option>
        <option value="15" selected>1秒に15枚 (標準速・おすすめ)</option>
        <option value="20">1秒に20枚 (高速)</option>
        <option value="30">1秒に30枚 (超高速・動画並み)</option>
      </select>
    </div>
  </div>

  <div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <div id="controls">
    <button id="action-btn" class="main-btn btn-start" onclick="toggleCapture()">撮影開始</button>
  </div>

  <div id="status">カメラを起動中...</div>

  <!-- 映像を画像化するための隠し要素 -->
  <canvas id="capture-canvas"></canvas>

  <script>
    let isCapturing = false;
    let captureInterval = null;
    let imagesCount = 0;
    let zip = null;
    let currentFPS = 15; 
    let currentFacingMode = "environment"; // デフォルトはアウカメ(背面)
    let currentStream = null;
    
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('capture-canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const actionBtn = document.getElementById('action-btn');
    const spotNameInput = document.getElementById('spot-name');
    const fpsSelect = document.getElementById('fps-select');

    function updateFPS(value) {
      currentFPS = parseFloat(value);
      if (isCapturing) {
        statusDiv.innerText = "⚠️ 撮影中に連写速度は変更できません。次の撮影から適用されます。";
      }
    }

    // 1. カメラ起動処理（インカメ・アウカメ対応）
    function initCamera() {
      // 既存のストリームがあれば停止させてから切り替える
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      statusBarMessage("カメラを切り替え中...");

      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: currentFacingMode, // "environment"(外) または "user"(内)
          width: { ideal: 640 },     
          height: { ideal: 480 }
        },
        audio: false
      })
      .then(stream => {
        currentStream = stream;
        video.srcObject = stream;
        const modeText = currentFacingMode === "environment" ? "アウカメ(背面)" : "インカメ(前面)";
        statusBarMessage(`カメラ起動完了 [${modeText}]。撮影開始を押してください。`);
      })
      .catch(err => {
        statusBarMessage("カメラの起動に失敗しました。HTTPS環境で試してください。");
        console.error(err);
      });
    }

    // カメラのイン・アウト切り替えボタンの処理
    function switchCamera() {
      if (isCapturing) {
        alert("撮影中はカメラを切り替えられません。一度停止してください。");
        return;
      }
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      initCamera();
    }

    // 2. 撮影ボタンの処理
    function toggleCapture() {
      if (!isCapturing) {
        startCapture();
      } else {
        stopAndDownload();
      }
    }

    // 3. 連続撮影の開始
    function startCapture() {
      isCapturing = true;
      imagesCount = 0;
      zip = new JSZip(); 
      
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      actionBtn.innerText = "撮影停止（ZIP保存）";
      actionBtn.className = "main-btn btn-stop";
      fpsSelect.disabled = true;

      // FPSからミリ秒の間隔を計算
      const intervalMs = 1000 / currentFPS;

      captureInterval = setInterval(() => {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // 圧縮率0.7で軽量化
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        const base64Data = dataUrl.split(',');
        
        const filename = `img_${String(imagesCount).padStart(4, '0')}.jpg`;
        zip.file(filename, base64Data, {base64: true});
        
        imagesCount++;
        statusBarMessage(`撮影中... 現在 ${imagesCount} 枚 (設定: ${fpsSelect.options[fpsSelect.selectedIndex].text})`);
      }, intervalMs);
    }

    // 4. 撮影停止とZIPダウンロード
    function stopAndDownload() {
      isCapturing = false;
      clearInterval(captureInterval);
      
      actionBtn.innerText = "処理中...";
      actionBtn.disabled = true;
      statusBarMessage("画像をまとめてZIPファイルを作成中。少々お待ちください...");

      const folderName = spotNameInput.value.trim() || "spot";

      zip.generateAsync({type: "blob"}).then(function(content) {
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(content);
        link.download = `${folderName}.zip`;
        link.click();

        actionBtn.innerText = "撮影開始";
        actionBtn.className = "main-btn btn-start";
        actionBtn.disabled = false;
        fpsSelect.disabled = false; 
        statusBarMessage(`保存完了！ [${folderName}.zip] (${imagesCount}枚の画像)`);
      });
    }

    function statusBarMessage(msg) {
      statusDiv.innerText = msg;
    }

    // 最初にカメラを自動起動
    initCamera();
  </script>
</body>
</html>
