<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モールス自由入力 | Free Morse Keying</title>
  <meta name="description" content="問題なしで自由にモールス信号を打ち込めるページ。ITU標準の1:3:7比率で短点・長点・文字間隔・単語間隔を自動判定。">
  <link rel="stylesheet" href="style.css">
  <style>
    .free-hero {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .free-hero h1 {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #60a5fa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .ratio-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .ratio-box strong { color: var(--accent); }
    .ratio-table {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.25rem 1rem;
      margin-top: 0.5rem;
    }
    .big-key {
      width: 100%;
      max-width: 320px;
      margin: 0 auto 1rem;
      display: block;
      padding: 1.4rem 1.5rem !important;
      font-size: 1.25rem !important;
    }
    .decoded-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      min-height: 3.5rem;
      font-size: 1.6rem;
      font-family: var(--mono);
      letter-spacing: 0.06em;
      word-break: break-all;
      margin-bottom: 0.75rem;
    }
    .morse-box {
      font-family: var(--mono);
      font-size: 1.15rem;
      color: var(--accent);
      letter-spacing: 0.12em;
      min-height: 2rem;
      word-break: break-all;
    }
    .controls-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
      margin-bottom: 1.25rem;
    }
    .controls-inline label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .controls-inline input[type="number"] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.7rem;
      border-radius: 8px;
      width: 100px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="free-hero">
      <h1>モールス自由入力</h1>
      <p class="subtitle">問題なし・好きなだけ打てる練習用キー</p>
    </header>

    <div class="ratio-box">
      <div><strong>ITU 標準タイミング（単位 = 短点の長さ）</strong></div>
      <div class="ratio-table">
        <span>短点（・）</span><span>1</span>
        <span>長点（－）</span><span>3</span>
        <span>符号内の間隔</span><span>1</span>
        <span>文字と文字の間隔</span><span>3</span>
        <span>単語と単語の間隔</span><span>7</span>
      </div>
      <p style="margin-top:0.6rem;margin-bottom:0;">スペースキー or 下の大きなボタンを押してキーイング。<br>
      押し時間で短点/長点を判定し、<strong>離してからの無音時間</strong>で文字・単語の区切りを自動で読み取ります。</p>
    </div>

    <div class="controls-inline">
      <label>
        速度（字/分）
        <input type="number" id="free-speed" value="75" min="10" max="150" step="5">
      </label>
      <label>
        周波数 (Hz)
        <input type="number" id="freq" value="700" min="400" max="1200" step="10">
      </label>
      <label>
        音量
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.4" style="width:120px;">
      </label>
      <button id="test-tone" class="btn secondary">テストトーン</button>
    </div>

    <div class="keying-area">
      <button id="free-key-button" class="btn key big-key">電鍵（押し続け / スペースキー）</button>
      <div class="action-row" style="justify-content:center;">
        <button id="free-clear" class="btn ghost">クリア</button>
        <button id="free-play-decoded" class="btn primary">解読結果を再生</button>
        <a href="index.html" class="btn secondary" style="text-decoration:none;display:inline-flex;align-items:center;">練習問題へ戻る</a>
      </div>

      <div class="prompt-label" style="margin-top:1rem;">解読テキスト</div>
      <div id="free-keyed-text" class="decoded-box">（ここに文字が自動で入ります）</div>

      <div class="prompt-label">打ち込んだ符号</div>
      <div id="free-keyed-morse" class="morse-box"></div>
    </div>

    <footer class="footer">
      <p>自由入力 — ローカル完結 / Web Audio API</p>
      <p><a href="index.html">← モールス練習トップ</a> · <a href="../">リポジトリトップ</a></p>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    // Free page specific bindings (script.js already defines the keying engine)
    document.addEventListener("DOMContentLoaded", () => {
      // Ensure audio settings
      if (typeof audio !== "undefined") {
        audio.setFreq(parseInt(document.getElementById("freq").value) || 700);
        audio.setVolume(parseFloat(document.getElementById("volume").value) || 0.4);
      }
      document.getElementById("freq").addEventListener("change", () => {
        audio.setFreq(parseInt(document.getElementById("freq").value) || 700);
      });
      document.getElementById("volume").addEventListener("input", () => {
        audio.setVolume(parseFloat(document.getElementById("volume").value) || 0.4);
      });
      document.getElementById("test-tone").addEventListener("click", () => {
        audio.setFreq(parseInt(document.getElementById("freq").value) || 700);
        audio.setVolume(parseFloat(document.getElementById("volume").value) || 0.4);
        audio.testTone(500);
      });
      document.getElementById("free-clear").addEventListener("click", clearKey);
      document.getElementById("free-play-decoded").addEventListener("click", async () => {
        if (!decodedText || !decodedText.trim()) return;
        if (audio.playing) { audio.stop(); return; }
        const speed = parseInt(document.getElementById("free-speed").value) || 75;
        const unit = speedToUnitMs(speed, true);
        audio.setFreq(parseInt(document.getElementById("freq").value) || 700);
        audio.setVolume(parseFloat(document.getElementById("volume").value) || 0.4);
        await audio.playMorse(decodedText.trim(), unit, null);
      });
      // Initial empty display
      clearKey();
      const t = document.getElementById("free-keyed-text");
      if (t) t.textContent = "（ここに文字が自動で入ります）";
    });
  </script>
</body>
</html>
