name: Validate sitePassword

on:
  push:
    paths:
      - "sitePassword.js"
      - "sitePassword.yml"
      - "sitePassword.css"
      - "index.html"
  pull_request:
    paths:
      - "sitePassword.js"
      - "sitePassword.yml"
      - "sitePassword.css"
      - "index.html"

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JS syntax
        run: node --check sitePassword.js

      - name: Check required files exist
        run: |
          test -f sitePassword.js
          test -f sitePassword.yml
          test -f sitePassword.css
          echo "All core files present"

      - name: Basic YAML structure check
        run: |
          python3 - <<'PY'
          import sys
          text = open("sitePassword.yml").read()
          if "id_hash:" not in text or "pass_hash:" not in text:
              print("Missing hash fields")
              sys.exit(1)
          if "roles:" not in text:
              print("Missing roles")
              sys.exit(1)
          print("YAML structure OK")
          PY
