<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found</title>
    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="/404.css">
</head>
<body>

    <!-- 背景のグリッド -->
    <div class="background-grid"></div>

    <!-- コンテンツエリア -->
    <div class="container" id="errorContainer">
        <div class="error-code" id="errorCode" data-text="404">404</div>
        <h1 class="title">Lost in Space</h1>
        <p class="message">リクエストされたページは、サイバー空間の彼方に消え去りました。</p>
        <a href="/" class="btn">トップページへ戻る</a>
    </div>

    <!-- JavaScriptファイルの読み込み -->
    <script src="/404.js"></script>
</body>
</html>
